name: Build RootlessJamesDSP debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build rootless debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRootlessFullDebug

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: RootlessJamesDSP-debug
          path: app/build/outputs/apk/rootlessFull/debug/*universal*.apk
          retention-days: 7